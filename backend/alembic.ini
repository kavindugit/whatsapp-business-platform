# alembic.ini — Alembic configuration for WhatsApp Business Platform
# The database URL is NOT stored here — it comes from MIGRATION_DATABASE_URL env var.
# See migrations/env.py for how the URL is injected.

[alembic]
# Path to migration scripts
script_location = migrations

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Truncate slug to prevent excessively long file names
truncate_slug_length = 40

# Timezone for generated timestamps
timezone = UTC

# Do not add revision IDs to migration files
output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
