[project]
name = "whatsapp-business-platform"
version = "0.1.0"
description = "WhatsApp Business Automation Platform — Week 1 Foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    # Data validation and settings
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    # Database
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<2",
    "psycopg[binary,pool]>=3.2.0,<4",
    # Security
    "argon2-cffi>=23.1.0,<24",
    # Redis (login throttling)
    "redis>=5.2.0,<6",
    # Validation utilities
    "phonenumbers>=8.13.0",
    "email-validator>=2.2.0",
    # Structured logging
    "structlog>=24.4.0",
    # CLI
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # mypy stubs
    "types-redis>=4.6.0",
    "sqlalchemy[mypy]>=2.0.36",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (partial)
    "N",   # pep8-naming
]
ignore = [
    "ANN101",  # self type annotation
    "ANN102",  # cls type annotation
    "S101",    # assert in tests
    "S104",    # 0.0.0.0 bind (compose decides binding)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"migrations/**" = ["ANN", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["factory.*", "argon2.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]
addopts = "--tb=short -q"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py", "migrations/*"]
